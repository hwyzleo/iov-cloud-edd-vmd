# VMD-DSN-CR-070：JSON java.time 时间契约治理（兼容阶段，FW-WEB-DSN-CR-001 框架 P1）
# 统一框架决策：FW-WEB-DSN-CR-001；需求 FR-070-1~5（VMD-REQ-CR-070）。
# 兼容阶段策略（写单一、读兼容）：
#   - date-format=epoch-millis：显式冻结存量毫秒数字输出（旧框架 epoch serializer 行为），不输出数组/秒小数；
#   - 双读始终生效（IovJavaTimeReadModule：ISO 字符串 + 10 位 epoch 秒 + 13 位 epoch 毫秒，非法输入 fail-closed）；
#   - zone-id：业务 ZoneId（LocalDateTime/OffsetDateTime 数字路径语义）。未注入时启动阻断，
#     禁止猜值通过；注入值须经生产实例 ZoneId.systemDefault()/-Duser.timezone/容器 TZ 与 DB→JDBC→Java→JSON
#     对账链核验（P0 门禁，见 VMD-DSN-CR-070 Notion 实现与验证记录）。
#   - ISO 输出切换：留待各消费方双读部署并签收后逐依赖边灰度（本 CR 不切全局 ISO）。
# 排除面不变：Keyprov Proto bytes、canonical/wire digest、签名、证书 DER、KL1 租约与冻结 Outbox payload 原样。
iov:
  web:
    jackson:
      date-format: epoch-millis
      # 生产注入路径（三选一；均未注入时下方占位符无法解析 → 启动阻断，强制先核验）：
      #   1) Nacos edd-vmd.yaml:  iov.web.jackson.zone-id: Asia/Shanghai
      #   2) 环境变量:             IOV_WEB_JACKSON_ZONE_ID=Asia/Shanghai
      #   3) 环境变量:             VMD_JACKSON_ZONE_ID=Asia/Shanghai（下方占位符引用）
      # 注意：不能写 ${VMD_JACKSON_ZONE_ID:} 空默认——空串绑定 ZoneId 会抛 DateTimeException。
      zone-id: ${VMD_JACKSON_ZONE_ID}
  kafka:
    topic-provisioning:
      # 服务启动后检查并创建 VMD 作为生产者输出的三个标准 Kafka Topic
      enabled: true

# Actuator 健康分组（VMD-DSN-CR-059 §7 / CR-060 §5.1、§7 / CR-061 §10）：Keyprov capability 独立呈现，
# 聚合 VMD 编排 + 根派生 Provider（Transit/HSM v2c-comm-root）+ framework 证书解析（VAGW keyprov 流量门禁），
# 并从主 readiness/liveness 聚合排除（KeyProvisioningHealthGroupsCustomizer）。
# 生产以 /actuator/health/keyprov 决定是否启用 Keyprov 流量；DOWN 时停止新 Request/Wrap/轮换/吊销。
management:
  endpoint:
    health:
      group:
        # Keyprov 域独立健康分组（CR-064：加入 FW-SEC transitDerivedKey 聚合指示器，
        # 区分「路由正常但 Transit 实现异常」与「VMD 总体编排异常」）。
        keyprov:
          include: keyProvisioningCapability,derivedKeyProvider,transitDerivedKey,certificateResolution,importProofVerification,tboxEcdhCertificate
          show-details: always

crypto:
  provisioning:
    enabled: true
    # CR-064：V2C DERIVED_ROOT 唯一 Provider 选择 = openbao-transit-local-wrap（FW-SEC-DSN-CR-019）。
    # 无默认值占位符：缺失即启动 fail-closed，禁止隐式回退 legacy openbao-business-key（RD-064-2/REQ-064-1）。
    # require-ready-at-startup=false 仅限 dev/test（跳过启动探测）。
    derived-key:
      provider: ${CRYPTO_PROVISIONING_DERIVED_KEY_PROVIDER}
      require-ready-at-startup: ${CRYPTO_PROVISIONING_DERIVED_KEY_REQUIRE_READY_AT_STARTUP:true}
      derivation-version: ${CRYPTO_PROVISIONING_DERIVED_KEY_DERIVATION_VERSION:v1}
      # CR-068 / FW-SEC-DSN-CR-020：外部 AAD profile——FW 在 AES-GCM 加密前调用 VMD 注册的 encoder。
      # 固定 PAR_PROTO_KEYPROV_AAD_V1；缺失/不一致时 keyprov Health 的 FW_EXTERNAL_AAD_PROFILE_READY 为 DOWN。
      aad-profile-id: ${CRYPTO_PROVISIONING_DERIVED_KEY_AAD_PROFILE_ID:PAR_PROTO_KEYPROV_AAD_V1}
      # CR-068 / FW-SEC-DSN-CR-020：Operation Result Store（字节级幂等重放）。生产必须使用持久化 store；
      # allow-in-memory 仅限 dev/test（进程重启不保留）。
      result-store:
        enabled: ${CRYPTO_PROVISIONING_DERIVED_KEY_RESULT_STORE_ENABLED:true}
        ttl: ${CRYPTO_PROVISIONING_DERIVED_KEY_RESULT_STORE_TTL:24h}
        allow-in-memory: ${CRYPTO_PROVISIONING_DERIVED_KEY_RESULT_STORE_ALLOW_IN_MEMORY:true}
      # 根映射声明：与 FW-SEC 编译期 allowlist 一致（TransitDerivedKeyProvider 启动校验必需）；
      # 不开放 allowlist 之外任意 root/HMAC/context（CR-064 §4.1）。
      roots:
        V2C_COMM_ROOT:
          transit-key: v2c-comm-root
          hmac-algorithm: sha2-256
          purposes: [UPLINK_AEAD, DOWNLINK_AEAD]
          wrap-modes: [DEVICE_CERT_PUBLIC_KEY]
  # 业务密钥域（CR-055）：VMD 作为目录 SSOT，framework 仅管密钥材料
  business-key:
    enabled: true
    directory:
      enabled: true
  # CR-060：business-key Provider（FW-SEC-DSN-CR-011）——仓内安全默认关闭，生产经 Nacos/Secret 显式开启；
  # 未就绪时 keyprov Health Group DOWN，禁止 keyprov 流量（发布顺序见 CR-060 §10.1）。
  # CR-064：OpenBao 端点与认证（openbao-transit-local-wrap 启动必需）。
  # RoleID/SecretID/Token 不写 Nacos 普通明文，经 Secret 引用注入（role-id-file/secret-id-file 或 token）。
  kms:
    endpoint: ${CRYPTO_KMS_ENDPOINT:http://openiov-openbao:8200}
    auth: ${CRYPTO_KMS_AUTH:approle}
    approle:
      role-id-file: ${CRYPTO_KMS_APPROLE_ROLE_ID_FILE:}
      secret-id-file: ${CRYPTO_KMS_APPROLE_SECRET_ID_FILE:}
    token: ${CRYPTO_KMS_TOKEN:}
    business-key:
      enabled: ${CRYPTO_KMS_BUSINESS_KEY_ENABLED:false}
      api-version: ${CRYPTO_KMS_BUSINESS_KEY_API_VERSION:v1}
      mount: ${CRYPTO_KMS_BUSINESS_KEY_MOUNT:business-key}
      capability-path: ${CRYPTO_KMS_BUSINESS_KEY_CAPABILITY_PATH:/v1/business-key/capabilities}
      require-ready-at-startup: ${CRYPTO_KMS_BUSINESS_KEY_REQUIRE_READY_AT_STARTUP:false}
      reconcile-enabled: ${CRYPTO_KMS_BUSINESS_KEY_RECONCILE_ENABLED:false}
  # CR-060：framework 默认证书材料解析（FW-SEC-DSN-CR-012）——仓内安全默认关闭；
  # trust-anchors-pem 仅经 Secret 注入（Nacos 不保存秘密正文）；生产固定 require-good-status=true 且启用 revocation。
  pki:
    certificate-resolution:
      enabled: ${CRYPTO_PKI_CERTIFICATE_RESOLUTION_ENABLED:false}
      inline-first: true
      provider-query-enabled: ${CRYPTO_PKI_CERTIFICATE_RESOLUTION_PROVIDER_QUERY_ENABLED:true}
      domain-directory-enabled: ${CRYPTO_PKI_CERTIFICATE_RESOLUTION_DOMAIN_DIRECTORY_ENABLED:true}
      require-unique-result: true
      trust-anchors-pem: ${CRYPTO_PKI_CERTIFICATE_RESOLUTION_TRUST_ANCHORS_PEM:}
      business-key-wrap:
        require-certificate: true
        require-trusted-chain: true
        require-good-status: ${CRYPTO_PKI_CERTIFICATE_RESOLUTION_REQUIRE_GOOD_STATUS:false}
  # CR-062 / FW-SEC-DSN-CR-016：导入证明验签能力。未就绪时 keyprov Health Group DOWN，不激活版本。
  # 生产要求 require-trusted-chain=true 且经 Secret 注入信任锚；require-ready-at-startup 默认 false（仅上报 NOT_READY）。
  import-proof:
    enabled: ${CRYPTO_IMPORT_PROOF_ENABLED:true}
    require-ready-at-startup: ${CRYPTO_IMPORT_PROOF_REQUIRE_READY_AT_STARTUP:false}
    certificate:
      require-certificate: true
      require-trusted-chain: ${CRYPTO_IMPORT_PROOF_REQUIRE_TRUSTED_CHAIN:true}
      require-good-status: ${CRYPTO_IMPORT_PROOF_REQUIRE_GOOD_STATUS:false}

# VMD Kafka Topic 目录（VMD-DSN-CR-051 / VMD-DSN-CR-052）：Listener 占位符 / Producer / Outbox 统一引用
vmd:
  kafka:
    topics:
      inventory-observed: ${VMD_KAFKA_TOPIC_INVENTORY_OBSERVED:ota.vehicle-software-inventory.observed}
      part-binding-changed: ${VMD_KAFKA_TOPIC_PART_BINDING_CHANGED:vmd.vehicle-part-binding.changed}
      vehicle-produce: ${VMD_KAFKA_TOPIC_VEHICLE_PRODUCE:vmd.vehicle-produce}
      software-inventory-changed: ${VMD_KAFKA_TOPIC_SOFTWARE_INVENTORY_CHANGED:vmd.vehicle-software-inventory.changed}
      # 设备业务密钥变更事件（CR-055，VMD 幂等创建，经 Outbox→Relay 发布）
      business-key-changed: ${VMD_KAFKA_TOPIC_BUSINESS_KEY_CHANGED:vmd.business-key.changed}
      # 零件实例入站事件（CR-056，VMD 幂等创建，经 Outbox→Relay 发布；重放场景）
      part-inbound-changed: ${VMD_KAFKA_TOPIC_PART_INBOUND_CHANGED:vmd.part-inbound.changed}
      # TBOX V2C 业务密钥导入完成事件（CR-058，VMD 幂等创建，经 Outbox→Relay 发布，Key=deviceSn）
      tbox-v2c-key-provisioned: ${VMD_KAFKA_TOPIC_TBOX_V2C_KEY_PROVISIONED:vmd.tbox-v2c-key-provisioned}
      # 11 个 EDD-MDM 消费 Topic（VMD-DSN-CR-052，全部 CONSUMER_ONLY，归 EDD-MDM 管理，VMD 只预检不创建）
      mdm:
        brand: ${VMD_KAFKA_TOPIC_MDM_BRAND:mdm.brand}
        car-line: ${VMD_KAFKA_TOPIC_MDM_CAR_LINE:mdm.car-line}
        configuration: ${VMD_KAFKA_TOPIC_MDM_CONFIGURATION:mdm.configuration}
        model: ${VMD_KAFKA_TOPIC_MDM_MODEL:mdm.model}
        option-code: ${VMD_KAFKA_TOPIC_MDM_OPTION_CODE:mdm.option-code}
        option-family: ${VMD_KAFKA_TOPIC_MDM_OPTION_FAMILY:mdm.option-family}
        part: ${VMD_KAFKA_TOPIC_MDM_PART:mdm.part}
        plant: ${VMD_KAFKA_TOPIC_MDM_PLANT:mdm.plant}
        platform: ${VMD_KAFKA_TOPIC_MDM_PLATFORM:mdm.platform}
        variant: ${VMD_KAFKA_TOPIC_MDM_VARIANT:mdm.variant}
        vehicle-node: ${VMD_KAFKA_TOPIC_MDM_VEHICLE_NODE:mdm.vehicle-node}
    mdm-consumer:
      # 预检失败是否 fail-fast（生产默认 true）；false 为降级启动，健康仍 DOWN/DEGRADED + 后台重试
      fail-fast: ${VMD_KAFKA_MDM_CONSUMER_FAIL_FAST:true}
      # MDM Listener 是否由 Spring 自动启动（默认 true）；false 时由预检 Readiness 门禁协调启动
      auto-startup: ${VMD_KAFKA_MDM_CONSUMER_AUTO_STARTUP:true}
      # 预检失败后的后台重试探测间隔（毫秒）
      retry-interval-ms: ${VMD_KAFKA_MDM_CONSUMER_RETRY_INTERVAL_MS:60000}
    topic-provisioning:
      partitions: ${VMD_KAFKA_TOPIC_PARTITIONS:1}
      replication-factor: ${VMD_KAFKA_TOPIC_REPLICATION_FACTOR:1}
      cleanup-policy: ${VMD_KAFKA_TOPIC_CLEANUP_POLICY:delete}
      # 生产 Topic 既有校验 / 观测 Topic 探测未达成（启动期 Broker 连接预热、瞬断等）时，后台重试间隔（毫秒）
      retry-interval-ms: ${VMD_KAFKA_TOPIC_RETRY_INTERVAL_MS:60000}
    readiness:
      # 生产 Topic readiness=DOWN 时暂停 Outbox Relay 发布
      gate-producer: ${VMD_KAFKA_READINESS_GATE_PRODUCER:true}
  # CR-063：逻辑证书 Profile 注册（仅逻辑开关与逻辑→框架 Profile 名映射；
  # 禁止出现 Provisioner password/JWK私钥/OTT/CA私钥/模板路径，物理 provider route 由 FW-SEC 配置与 Secret 管理）
  certificate:
    profiles:
      tbox-device-ecdh-es-p256-v1:
        # enabled=false 时关闭整个新 ECDH-ES 证书签发与 Keyprov 请求路径（RD-063-6，不回退旧 Profile）
        enabled: ${VMD_CERTIFICATE_PROFILE_TBOX_ECDH_ES_P256_V1_ENABLED:true}
        framework-profile: ${VMD_CERTIFICATE_PROFILE_TBOX_ECDH_ES_P256_V1_FRAMEWORK:TBOX_DEVICE_ECDH_ES_P256_V1}
  business-key:
    policy:
      # 版本化授权策略（fail-closed：未登记域/用途一律拒绝）。生产经 Nacos 下发受治理条目。
      version: v1
      entries:
        # CR-058 冻结 V2C 业务域与用途代码（不可按环境改名）；调用方/算法/有效期/重叠窗口使用环境批准值。
        - business-domain: V2C_COMM
          purposes: [UPLINK_AEAD, DOWNLINK_AEAD]
          device-categories: [TBOX]
          allowed-actions: [PROVISION, RESOLVE_ACTIVE, DECRYPT, ROTATE, REVOKE]
          algorithm: AES
          key-spec: AES-256-GCM
          validity: 365d
          decrypt-window: 7d
    mapping:
      # CR-058：V2C_COMM_ROOT 仅为 framework/KMS 材料 BizType，绝不透传到车云协议业务域。
      # 双向必须一一对应，缺失或冲突启动期 fail-fast。
      biz-type-domain:
        V2C_COMM_ROOT: V2C_COMM
      domain-biz-type:
        V2C_COMM: V2C_COMM_ROOT
    provisioning:
      # keyprov capability 功能开关（默认关闭 fail-closed，release-set 就绪后开启）
      # enabled=false 时不装配官方 Keyprov Controller/Adapter，capability 状态 DISABLED
      keyprov:
        enabled: ${VMD_BUSINESS_KEY_KEYPROV_ENABLED:true}
        # 受信调用方 allowlist（逗号分隔，默认仅 VAGW workload identity）
        allowed-callers: ${VMD_BUSINESS_KEY_KEYPROV_ALLOWED_CALLERS:VAGW}
        # canonical 协议版本 allowlist 值
        schema-version: ${VMD_BUSINESS_KEY_KEYPROV_SCHEMA_VERSION:keyprov-v1}
        # CR-062 §4.1：VMD 固定的 PAR-PROTO release / DescriptorSet hash（精确 allowlist，不 trim/大小写折叠）；
        # 缺失时 envelope v1 能力 NOT_READY 且请求 fail-closed（经 Nacos/Secret 下发）。
        protocol-release: ${VMD_BUSINESS_KEY_KEYPROV_PROTOCOL_RELEASE:}
        descriptor-set-hash: ${VMD_BUSINESS_KEY_KEYPROV_DESCRIPTOR_SET_HASH:}
        # canonical payload 大小上限（bytes）
        max-payload-bytes: ${VMD_BUSINESS_KEY_KEYPROV_MAX_PAYLOAD_BYTES:16384}
      # CR-068：Response 字节级幂等重放存储密钥（Base64 AES-256，经 Secret 注入，Nacos 不保存明文）。
      # 未注入时 keyprov Health 的 KEYPROV_RESPONSE_REPLAY_STORE_READY 为 DOWN，禁止新流量。
      response-store:
        key: ${KEYPROV_RESPONSE_STORE_KEY:}
      # Wrapped Key bundle 可接受期限（秒）
      bundle-ttl-seconds: ${VMD_BUSINESS_KEY_BUNDLE_TTL_SECONDS:3600}
      # WAIT_DEVICE_ACK 超时转 EXPIRED（秒）
      ack-timeout-seconds: ${VMD_BUSINESS_KEY_ACK_TIMEOUT_SECONDS:900}
      # RECONCILE_REQUIRED 告警与对账阈值（秒，独立于 ACK 短 TTL，不直接过期）
      reconcile-alert-seconds: ${VMD_BUSINESS_KEY_RECONCILE_ALERT_SECONDS:86400}
      # PREPARING 滞留告警阈值（秒，根派生依赖不可用待同requestId重试，不直接过期）
      preparing-alert-seconds: ${VMD_BUSINESS_KEY_PREPARING_ALERT_SECONDS:86400}
    maintenance:
      scheduler:
        enabled: ${VMD_BUSINESS_KEY_MAINTENANCE_ENABLED:true}
        batch-size: ${VMD_BUSINESS_KEY_MAINTENANCE_BATCH_SIZE:200}
      # VMD-DSN-CR-065：MPT 一键清理阻塞（运维终止）开关，默认关闭 fail-closed
      terminate-enabled: ${VMD_BUSINESS_KEY_TERMINATE_ENABLED:false}
      # 最小滞留阈值（秒）：滞留未超过该阈值时禁止运维终止（NOT_STALE）
      terminate-stale-threshold-seconds: ${VMD_BUSINESS_KEY_TERMINATE_STALE_THRESHOLD_SECONDS:86400}
  binding:
    kafka:
      enabled: ${VMD_BINDING_KAFKA_ENABLED:true}
      # topic 统一由 vmd.kafka.topics.part-binding-changed 提供
  software-inventory:
    observed:
      kafka:
        enabled: ${VMD_SOFTWARE_INVENTORY_OBSERVED_KAFKA_ENABLED:false}
        # topic 统一由 vmd.kafka.topics.inventory-observed 提供
        group-id: ${VMD_SOFTWARE_INVENTORY_OBSERVED_KAFKA_GROUP:edd-vmd-vehicle-software-inventory}
        dlq-topic: ${VMD_SOFTWARE_INVENTORY_OBSERVED_KAFKA_DLQ:ota.vehicle-software-inventory.observed.dlq}
    changed:
      kafka:
        # 软件清单变更事件经 vmd_outbox → OutboxRelay 发布（Key=VIN）；topic 由 vmd.kafka.topics.software-inventory-changed 提供

# MDM同步配置（VMD-DSN-CR-052：Topic 名称统一由 vmd.kafka.topics.mdm.* 提供，归 EDD-MDM 管理）
# 迁移映射（旧名 → 目录名，REQ §3.1.3；观察期结束后清理旧配置，代码/测试已零引用）:
#   mdm.product.brand.{created,updated,deactivated}      → mdm.brand
#   mdm.product.carLine.{created,updated,deactivated}    → mdm.car-line
#   mdm.product.platform.{created,updated,deactivated}   → mdm.platform
#   mdm.org.plant.event                                  → mdm.plant
#   mdm.product.model.{created,updated,deactivated}      → mdm.model
#   mdm.product.variant.{created,updated,deactivated}    → mdm.variant
#   mdm.product.configuration.{created,updated,deactivated} → mdm.configuration
#   mdm.product.optionFamily.{created,updated,deactivated}  → mdm.option-family
#   mdm.eead.vehicleNode.event                           → mdm.vehicle-node
#   mdm.material.part.event                              → mdm.part
#   （旧）无 OptionCode 消费者（新增）                    → mdm.option-code
mdm:
  sync:
    brand:
      kafka:
        enabled: ${MDM_BRAND_KAFKA_ENABLED:true}
        # created-topic: ${MDM_BRAND_KAFKA_CREATED_TOPIC:mdm.product.brand.created}   # 已迁移至 vmd.kafka.topics.mdm.brand
        # updated-topic: ${MDM_BRAND_KAFKA_UPDATED_TOPIC:mdm.product.brand.updated}   # 已迁移至 vmd.kafka.topics.mdm.brand
        # deactivated-topic: ${MDM_BRAND_KAFKA_DEACTIVATED_TOPIC:mdm.product.brand.deactivated} # 已迁移至 vmd.kafka.topics.mdm.brand
    car-line:
      kafka:
        enabled: ${MDM_CAR_LINE_KAFKA_ENABLED:true}
        # created-topic: ${MDM_CAR_LINE_KAFKA_CREATED_TOPIC:mdm.product.carLine.created}     # 已迁移至 vmd.kafka.topics.mdm.car-line
        # updated-topic: ${MDM_CAR_LINE_KAFKA_UPDATED_TOPIC:mdm.product.carLine.updated}     # 已迁移至 vmd.kafka.topics.mdm.car-line
        # deactivated-topic: ${MDM_CAR_LINE_KAFKA_DEACTIVATED_TOPIC:mdm.product.carLine.deactivated} # 已迁移至 vmd.kafka.topics.mdm.car-line
    platform:
      kafka:
        enabled: ${MDM_PLATFORM_KAFKA_ENABLED:true}
        # created-topic: ${MDM_PLATFORM_KAFKA_CREATED_TOPIC:mdm.product.platform.created}   # 已迁移至 vmd.kafka.topics.mdm.platform
        # updated-topic: ${MDM_PLATFORM_KAFKA_UPDATED_TOPIC:mdm.product.platform.updated}   # 已迁移至 vmd.kafka.topics.mdm.platform
        # deactivated-topic: ${MDM_PLATFORM_KAFKA_DEACTIVATED_TOPIC:mdm.product.platform.deactivated} # 已迁移至 vmd.kafka.topics.mdm.platform
    plant:
      kafka:
        enabled: ${MDM_PLANT_KAFKA_ENABLED:true}
        # topic: ${MDM_PLANT_KAFKA_TOPIC:mdm.org.plant.event}    # 已迁移至 vmd.kafka.topics.mdm.plant
    model:
      kafka:
        enabled: ${MDM_MODEL_KAFKA_ENABLED:true}
        # created-topic: ${MDM_MODEL_KAFKA_CREATED_TOPIC:mdm.product.model.created}     # 已迁移至 vmd.kafka.topics.mdm.model
        # updated-topic: ${MDM_MODEL_KAFKA_UPDATED_TOPIC:mdm.product.model.updated}     # 已迁移至 vmd.kafka.topics.mdm.model
        # deactivated-topic: ${MDM_MODEL_KAFKA_DEACTIVATED_TOPIC:mdm.product.model.deactivated} # 已迁移至 vmd.kafka.topics.mdm.model
    variant:
      kafka:
        enabled: ${MDM_VARIANT_KAFKA_ENABLED:true}
        # created-topic: ${MDM_VARIANT_KAFKA_CREATED_TOPIC:mdm.product.variant.created}   # 已迁移至 vmd.kafka.topics.mdm.variant
        # updated-topic: ${MDM_VARIANT_KAFKA_UPDATED_TOPIC:mdm.product.variant.updated}   # 已迁移至 vmd.kafka.topics.mdm.variant
        # deactivated-topic: ${MDM_VARIANT_KAFKA_DEACTIVATED_TOPIC:mdm.product.variant.deactivated} # 已迁移至 vmd.kafka.topics.mdm.variant
    configuration:
      kafka:
        enabled: ${MDM_CONFIGURATION_KAFKA_ENABLED:true}
